services:
  - type: web
    name: carbontrack
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: carbontrack-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEV_MODE
        value: "false"
      - key: AUTO_MIGRATE
        value: "false"
      - key: SEED_DEFAULT_SETTINGS
        value: "true"
      - key: DISABLE_SCHEDULER
        value: "false"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
